name: Marketing site build

on:
  pull_request:
    paths:
      - 'marketing-site/**'
      - '.github/workflows/marketing-site-build.yml'
  push:
    branches:
      - feature/public-marketing-site
    paths:
      - 'marketing-site/**'
      - '.github/workflows/marketing-site-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            marketing-site/client/package.json
            marketing-site/server/package.json
      - name: Install and build client
        working-directory: marketing-site/client
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install and build API
        working-directory: marketing-site/server
        run: |
          npm install --no-audit --no-fund
          npm run build
